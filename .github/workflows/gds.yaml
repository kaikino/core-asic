name: gds

# The official TinyTapeout/tt-gds-action@ihp-cmos5l flow, spelled out step by
# step so that the 8x4 floorplan template (which the current CMOS5L support
# tools do not ship) can be generated with flow/gen_tile_def.py before
# hardening.  Once upstream adds 8x4, this job can go back to the one-line
# `uses: TinyTapeout/tt-gds-action@ihp-cmos5l` form.
on:
  push:
  workflow_dispatch:

env:
  PDK: ihp-sg13cmos5l
  PDK_ROOT: /home/runner/pdk
  TT_ARGS: --ihp

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin pngquant

      - name: Checkout tt-support-tools (CMOS5L branch)
        uses: actions/checkout@v6
        with:
          repository: htfab/tt-support-tools
          ref: cmos
          path: tt

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tt-support-tools dependencies
        run: pip install -r tt/requirements.txt

      - name: Add the 8x4 floorplan template
        run: |
          python3 flow/gen_tile_def.py --check tt/tech/ihp-sg13cmos5l/def
          python3 flow/gen_tile_def.py tt/tech/ihp-sg13cmos5l/def/tt_block_8x2_pgvdd.def tt/tech/ihp-sg13cmos5l/def/tt_block_8x4_pgvdd.def
          grep -q '^8x4:' tt/tech/ihp-sg13cmos5l/tile_sizes.yaml || echo '8x4: "0 0 1724.16 710.64"' >> tt/tech/ihp-sg13cmos5l/tile_sizes.yaml

      - name: Fetch verilog and build config
        run: ./tt/tt_tool.py --create-user-config $TT_ARGS

      - name: Install ihp-sg13cmos5l PDK
        run: flow/install_pdk.sh

      - name: Install LibreLane
        run: pip install librelane==3.0.0rc1

      - name: Make GDS with LibreLane
        run: ./tt/tt_tool.py --harden $TT_ARGS

      - name: Linter output
        if: always()
        run: cat runs/wokwi/*-verilator-lint/verilator-lint.log || true

      - name: Yosys warnings
        run: ./tt/tt_tool.py --print-warnings $TT_ARGS >> $GITHUB_STEP_SUMMARY

      - name: Routing summary
        run: ./tt/tt_tool.py --print-stats $TT_ARGS >> $GITHUB_STEP_SUMMARY

      - name: Cell usage summary
        run: ./tt/tt_tool.py --print-cell-category $TT_ARGS >> $GITHUB_STEP_SUMMARY

      - name: Publish build logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: GDS_logs
          path: |
            src/*
            runs/wokwi/*

      - name: Prepare tt_submission artifact
        run: ./tt/tt_tool.py --create-tt-submission $TT_ARGS

      - name: Publish tt_submission artifact
        uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: |
            src/*
            docs/*
            tt_submission/*
            info.yaml
            LICENSE

      - name: Render PNG from GDS
        run: './tt/tt_tool.py --create-png $TT_ARGS 2>&1 || echo "WARNING: Failed to render PNG preview from GDS; error $?"'

      - name: Upload gds_render (png) artifact
        uses: actions/upload-artifact@v7
        with:
          name: gds_render
          path: 'gds_render.png'

  # precheck and gl_test mirror TinyTapeout/tt-gds-action/{precheck,gl_test}
  # @ihp-cmos5l but install the PDK with flow/install_pdk.sh: the action's own
  # installer clones ihp-sg13cmos5l into a directory that the IHP-Open-PDK
  # dev branch now already contains, so the upstream jobs fail before they
  # start.
  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Checkout tt-support-tools (CMOS5L branch)
        uses: actions/checkout@v6
        with:
          repository: htfab/tt-support-tools
          ref: cmos
          path: tt

      - name: Add the 8x4 floorplan template
        run: |
          python3 flow/gen_tile_def.py tt/tech/ihp-sg13cmos5l/def/tt_block_8x2_pgvdd.def tt/tech/ihp-sg13cmos5l/def/tt_block_8x4_pgvdd.def
          grep -q '^8x4:' tt/tech/ihp-sg13cmos5l/tile_sizes.yaml || echo '8x4: "0 0 1724.16 710.64"' >> tt/tech/ihp-sg13cmos5l/tile_sizes.yaml

      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: tt/precheck
        run: pip install -r requirements.txt

      - name: Run the CMOS5L DRC in tiled mode
        # The deck's default deep mode needs hours on a 1.2 mm2 block (it
        # exceeded the 6 h job limit); tiled multi-threaded mode gives the
        # same clean result in under a minute.
        run: python3 flow/patch_precheck_tiling.py tt/precheck/precheck.py

      - name: Install ihp-sg13cmos5l PDK
        run: flow/install_pdk.sh

      - name: Install Nix
        uses: rikhuijzer/cache-install@v1.1.4
        with:
          key: nix-${{ hashFiles('tt/precheck/default.nix') }}
          nix_file: 'tt/precheck/default.nix'

      - name: Build Nix packages
        working-directory: tt/precheck
        run: nix-build

      - name: Run precheck
        working-directory: tt/precheck
        run: nix-shell --run "python precheck.py --gds ${{ github.workspace }}/tt_submission/*.gds* --tech $PDK"

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: 'tt/precheck/reports/results.xml'
        if: always()

      - name: Capture test results
        working-directory: tt/precheck
        if: always()
        run: cat reports/results.md >> $GITHUB_STEP_SUMMARY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precheck_reports
          path: tt/precheck/reports

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Install ihp-sg13cmos5l PDK
        run: flow/install_pdk.sh

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Install iverilog
        run: |
          wget https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      - name: Run tests
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.vcd tb.fst results.xml
          make clean
          GATES=yes make
          test -f results.xml
          ! grep failure results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatelevel_test_results
          path: |
            test/tb.fst
            test/results.xml

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.4
        with:
          paths: test/results.xml

  # Needs GitHub Pages enabled for the repository (Settings > Pages > Source:
  # GitHub Actions); otherwise this job fails with a 404 deployment error.
  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
