<rect width="920" height="470" fill="#0d1117"/>
<rect x="170" y="18" width="600" height="434" rx="14" fill="none" stroke="#6e7681" stroke-dasharray="6 5" stroke-width="1.2"/>
<text x="186" y="40" font-size="12" font-weight="700" fill="#9198a1" letter-spacing="1">TT_UM_KAIKINO_PROTOCOL_EMU · IHP CMOS5L 130 nm · 8x4 tiles · 40 MHz</text>
<rect x="20" y="190" width="120" height="84" rx="8" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
<text x="80.0" y="212" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">Host MCU</text>
<text x="80.0" y="232" text-anchor="middle" font-size="12" fill="#9198a1">RP2040 on the</text>
<text x="80.0" y="248" text-anchor="middle" font-size="12" fill="#9198a1">Tiny Tapeout board</text>
<line x1="140" y1="232" x2="190" y2="232" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
<text x="80" y="166" text-anchor="middle" font-size="11" fill="#9198a1">SPI mode 0</text>
<text x="80" y="180" text-anchor="middle" font-size="11" fill="#9198a1">32-bit frames, SCK up to 5 MHz</text>
<rect x="190" y="56" width="130" height="382" rx="8" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
<text x="255.0" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">Host link</text>
<text x="255.0" y="98" text-anchor="middle" font-size="12" fill="#9198a1">oversampled SPI slave</text>
<text x="255.0" y="114" text-anchor="middle" font-size="12" fill="#9198a1">one clock domain</text>
<text x="255.0" y="130" text-anchor="middle" font-size="12" fill="#9198a1"></text>
<text x="255.0" y="146" text-anchor="middle" font-size="12" fill="#9198a1">command decoder</text>
<text x="255.0" y="162" text-anchor="middle" font-size="12" fill="#9198a1">program load · run</text>
<text x="255.0" y="178" text-anchor="middle" font-size="12" fill="#9198a1">mailboxes</text>
<text x="255.0" y="194" text-anchor="middle" font-size="12" fill="#9198a1">permissions</text>
<text x="255.0" y="210" text-anchor="middle" font-size="12" fill="#9198a1">capture control</text>
<text x="255.0" y="226" text-anchor="middle" font-size="12" fill="#9198a1"></text>
<text x="255.0" y="242" text-anchor="middle" font-size="12" fill="#9198a1">status · trace</text>
<text x="255.0" y="258" text-anchor="middle" font-size="12" fill="#9198a1">readback on MISO</text>
<rect x="360" y="56" width="210" height="96" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="465.0" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">PIO engine 0</text>
<text x="465.0" y="98" text-anchor="middle" font-size="12" fill="#9198a1">128 x 16 program words</text>
<text x="465.0" y="114" text-anchor="middle" font-size="12" fill="#9198a1">4 regs · carry · 12-bit delay</text>
<text x="465.0" y="130" text-anchor="middle" font-size="12" fill="#9198a1">one instruction per clock</text>
<rect x="360" y="168" width="210" height="96" rx="8" fill="#0c2d6b" stroke="#58a6ff" stroke-width="1.5"/>
<text x="465.0" y="190" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">PIO engine 1</text>
<text x="465.0" y="210" text-anchor="middle" font-size="12" fill="#9198a1">identical, independent</text>
<text x="465.0" y="226" text-anchor="middle" font-size="12" fill="#9198a1">waits on pins, mailbox</text>
<text x="465.0" y="242" text-anchor="middle" font-size="12" fill="#9198a1">or the other engine</text>
<rect x="360" y="282" width="210" height="70" rx="8" fill="#0f2e1b" stroke="#3fb950" stroke-width="1.5"/>
<text x="465.0" y="304" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">Data FIFO + CRC</text>
<text x="465.0" y="324" text-anchor="middle" font-size="12" fill="#9198a1">128 bytes · one-clock pop</text>
<text x="465.0" y="340" text-anchor="middle" font-size="12" fill="#9198a1">programmable CRC-32 / 16 / 15</text>
<rect x="360" y="368" width="210" height="70" rx="8" fill="#0f2e1b" stroke="#3fb950" stroke-width="1.5"/>
<text x="465.0" y="390" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">Trace buffer</text>
<text x="465.0" y="410" text-anchor="middle" font-size="12" fill="#9198a1">32 x 32 bits · 16-bit timestamps</text>
<text x="465.0" y="426" text-anchor="middle" font-size="12" fill="#9198a1">trigger + pin-change capture</text>
<line x1="320" y1="104" x2="360" y2="104" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
