<text x="845" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">CFG_SCK/MOSI/</text>
<text x="845" y="365" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">CS_N/MISO</text>
