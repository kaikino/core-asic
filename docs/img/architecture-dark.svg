<line x1="320" y1="403" x2="360" y2="403" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
<rect x="610" y="56" width="140" height="208" rx="8" fill="#3b2300" stroke="#e3b341" stroke-width="1.5"/>
<text x="680.0" y="78" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">Pin arbiter</text>
<text x="680.0" y="98" text-anchor="middle" font-size="12" fill="#9198a1">host-set drive masks</text>
<text x="680.0" y="114" text-anchor="middle" font-size="12" fill="#9198a1">both engines enable</text>
<text x="680.0" y="130" text-anchor="middle" font-size="12" fill="#9198a1">the same pin ⇒ Hi-Z</text>
<text x="680.0" y="146" text-anchor="middle" font-size="12" fill="#9198a1">+ sticky fault</text>
<text x="680.0" y="162" text-anchor="middle" font-size="12" fill="#9198a1">(formally proved)</text>
<line x1="570" y1="104" x2="610" y2="104" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
<line x1="570" y1="216" x2="610" y2="216" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
<rect x="610" y="282" width="140" height="156" rx="8" fill="#2d1a4a" stroke="#bc8cff" stroke-width="1.5"/>
<text x="680.0" y="304" text-anchor="middle" font-weight="700" font-size="14" fill="#e6edf3">Delay lines</text>
<text x="680.0" y="324" text-anchor="middle" font-size="12" fill="#9198a1">2 x TDC + 2 x DTC</text>
<text x="680.0" y="340" text-anchor="middle" font-size="12" fill="#9198a1">128 stages each</text>
<text x="680.0" y="356" text-anchor="middle" font-size="12" fill="#9198a1">0.22 ns per stage</text>
<text x="680.0" y="372" text-anchor="middle" font-size="12" fill="#9198a1">self-calibrating</text>
<text x="680.0" y="388" text-anchor="middle" font-size="12" fill="#9198a1">against the clock</text>
<line x1="570" y1="317" x2="610" y2="317" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
<line x1="680" y1="282" x2="680" y2="264" stroke="#6e7681" stroke-width="1.6" marker-end="url(#head)" marker-start="url(#dot)"/>
